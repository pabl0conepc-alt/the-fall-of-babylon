name: Native installers

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debian:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install packaging tool
        run: python -m pip install -r packaging/requirements-build.txt
      - name: Run tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Build and install Debian package
        run: |
          bash packaging/linux/build_deb.sh
          sudo dpkg -i dist/babylon_*.deb
          python packaging/smoke_test.py
          sudo dpkg -r babylon
      - uses: actions/upload-artifact@v4
        with:
          name: babylon-debian-ubuntu-x86_64
          path: dist/babylon_*.deb
          if-no-files-found: error

  arch:
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel
    steps:
      - name: Install Arch build tools
        run: pacman -Syu --noconfirm git python python-pip
      - uses: actions/checkout@v4
      - name: Build and install Arch package
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- env GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            bash -c 'cd "$GITHUB_WORKSPACE/packaging/arch" && makepkg --cleanbuild --noconfirm'
          pacman -U --noconfirm "$GITHUB_WORKSPACE"/packaging/arch/babylon-*.pkg.tar.zst
          python "$GITHUB_WORKSPACE/packaging/smoke_test.py"
          pacman -R --noconfirm babylon
      - uses: actions/upload-artifact@v4
        with:
          name: babylon-arch-x86_64
          path: packaging/arch/babylon-*.pkg.tar.zst
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install packaging tools
        run: |
          python -m pip install -r packaging/requirements-build.txt
          dotnet tool install --global wix --version 5.0.2
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.dotnet\tools"
      - name: Build, install, and smoke-test MSI
        shell: pwsh
        run: |
          python packaging/build_binary.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = python -c "import tomllib; print(tomllib.loads(open('pyproject.toml', 'rb').read().decode())['project']['version'])"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $binary = (Resolve-Path dist/babylon.exe).Path
          wix build packaging/windows/Product.wxs -arch x64 -d "Version=$version" -d "BinaryPath=$binary" -o "dist/babylon_${version}_windows_x64.msi"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $msi = (Resolve-Path "dist/babylon_${version}_windows_x64.msi").Path
          $install = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "MSI installation failed with exit code $($install.ExitCode)" }
          $env:PATH = "$env:ProgramFiles\Babylon;$env:PATH"
          python packaging/smoke_test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $uninstall = Start-Process msiexec.exe -ArgumentList "/x `"$msi`" /qn /norestart" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "MSI removal failed with exit code $($uninstall.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: babylon-windows-10-11-x64
          path: dist/babylon_*_windows_x64.msi
          if-no-files-found: error

  macos:
    runs-on: macos-15
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install packaging tool
        run: python -m pip install -r packaging/requirements-build.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build, install, and smoke-test package
        run: |
          bash packaging/macos/build_pkg.sh
          sudo installer -pkg dist/babylon_*_macos.pkg -target /
          python packaging/smoke_test.py
          sudo rm -f /usr/local/bin/babylon /usr/local/share/doc/babylon/README.md /usr/local/share/doc/babylon/INSTALL.md
      - uses: actions/upload-artifact@v4
        with:
          name: babylon-macos
          path: dist/babylon_*_macos.pkg
          if-no-files-found: error
